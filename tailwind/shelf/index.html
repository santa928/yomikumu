<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>夕暮れ文庫の二冊</title>
  <link rel="stylesheet" href="shelf.css">
</head>
<body class="p-4 bg-white">
  <main>
    <h1 class="text-lg">夕暮れ文庫の二冊</h1>
    <section aria-label="今週の選書" data-part="shelf" class="flex flex-col gap-4 sm:flex-row">
      <article data-part="card" class="text-dusk">
        <h2>夜の庭</h2><details><summary>本の紹介</summary><p>花の香りを頼りに夕方の道を歩く、短い散歩の記録です。</p></details>
      </article>
      <article data-part="other" class="text-dusk">
        <h2>星の小径</h2><details><summary>本の紹介</summary><p>町の灯りが消えるころ、小さな星座を見つけます。</p></details>
      </article>
    </section>
  </main>
</body>
</html>
