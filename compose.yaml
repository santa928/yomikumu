services:
  web:
    image: nginx:alpine
    network_mode: bridge
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./padding.html:/usr/share/nginx/html/padding.html:ro
      - ./arrow.png:/usr/share/nginx/html/arrow.png:ro
      - ./ink.css:/usr/share/nginx/html/ink.css:ro
      - ./viewport-sample.html:/usr/share/nginx/html/viewport-sample.html:ro
      - ./harbor.png:/usr/share/nginx/html/harbor.png:ro
      - ./moon.png:/usr/share/nginx/html/moon.png:ro
      - ./vendor:/usr/share/nginx/html/vendor:ro
      - ./app:/usr/share/nginx/html/app:ro
      - ./html-css:/usr/share/nginx/html/html-css:ro
      - ./javascript:/usr/share/nginx/html/javascript:ro
      - ./python:/usr/share/nginx/html/python:ro
      - ./dom:/usr/share/nginx/html/dom:ro
      - ./tailwind:/usr/share/nginx/html/tailwind:ro
      - ./typescript:/usr/share/nginx/html/typescript:ro
      - ./react:/usr/share/nginx/html/react:ro
      - ./next:/usr/share/nginx/html/next:ro
  test:
    profiles: ["test"]
    build: ./tests
    network_mode: none
    volumes:
      - .:/course:ro
