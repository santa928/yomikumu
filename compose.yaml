services:
  web:
    image: nginx:alpine
    network_mode: bridge
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./padding.html:/usr/share/nginx/html/padding.html:ro
      - ./lesson.css:/usr/share/nginx/html/lesson.css:ro
      - ./exhibition.js:/usr/share/nginx/html/exhibition.js:ro
      - ./contact.js:/usr/share/nginx/html/contact.js:ro
      - ./arrow.png:/usr/share/nginx/html/arrow.png:ro
      - ./typography.js:/usr/share/nginx/html/typography.js:ro
      - ./ink.css:/usr/share/nginx/html/ink.css:ro
      - ./boxes.js:/usr/share/nginx/html/boxes.js:ro
      - ./course.js:/usr/share/nginx/html/course.js:ro
      - ./preview.js:/usr/share/nginx/html/preview.js:ro
      - ./progress.js:/usr/share/nginx/html/progress.js:ro
      - ./grading.js:/usr/share/nginx/html/grading.js:ro
      - ./workbook.js:/usr/share/nginx/html/workbook.js:ro
  test:
    profiles: ["test"]
    build: ./tests
    network_mode: none
    volumes:
      - .:/course:ro
